name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly disclosed dependency vulnerability surfaces even when
    # nobody has pushed. An assessment tool that is itself vulnerable is worse
    # than no assessment tool.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # The gate that matters most. Runs first and alone, so a read-only violation
  # is impossible to miss in a wall of green checkmarks.
  # ---------------------------------------------------------------------------
  readonly-verification:
    name: Read-only verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Assert no write-capable API call exists in src/
        run: python tools/verify_readonly.py

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests tools
      - name: ruff format
        run: ruff format --check src tests tools
      - name: mypy
        run: mypy

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: bandit (static analysis for insecure patterns)
        run: bandit -c pyproject.toml -r src -ll

      - name: pip-audit (known vulnerabilities in dependencies)
        run: |
          # Audit the installed dependencies; the project itself is not on PyPI.
          pip freeze --exclude-editable > "$RUNNER_TEMP/requirements-audit.txt"
          pip-audit --strict --desc -r "$RUNNER_TEMP/requirements-audit.txt"

      - name: gitleaks (committed secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert no client data is tracked
        # snapshots/ and output/ hold client identity data. Only .gitkeep may
        # ever appear there. Checked in CI as well as pre-commit, because
        # pre-commit can be bypassed with --no-verify.
        run: |
          tracked=$(git ls-files snapshots output | grep -v '\.gitkeep$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Client data is tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo "No client data tracked."

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libcairo2 libgdk-pixbuf-2.0-0

      - run: pip install -e ".[dev]"

      - name: Security controls (must never regress)
        run: pytest -m security -v

      - name: Full suite with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Fixtures are reproducible
        # The fixture set is the basis of every rule test. If it drifts from its
        # generator, the tests are asserting against something nobody reviewed.
        run: |
          python tools/generate_fixtures.py
          git diff --exit-code fixtures/ \
            || (echo "::error::fixtures/ differ from tools/generate_fixtures.py output" && exit 1)

  build-image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [readonly-verification, test]
    steps:
      - uses: actions/checkout@v4

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build
        # The image runs `icp verify-scopes`, `icp list-rules` and a WeasyPrint
        # render at build time, so a broken scope allowlist, an unregistered
        # rule, or a missing font library fails here rather than in front of a
        # client.
        run: docker build -t icp:ci .

      - name: Confirm the image does not run as root
        run: |
          user=$(docker run --rm --entrypoint id icp:ci -un)
          test "$user" = "icp" || { echo "::error::image runs as $user"; exit 1; }

      - name: Confirm no client data is baked into the image
        # snapshots/ and output/ must be empty in the image. A snapshot in a
        # layer is a breach waiting to be pushed to a registry.
        run: |
          contents=$(docker run --rm --entrypoint sh icp:ci -c \
            'ls -A /work/snapshots /work/output 2>/dev/null' || true)
          if [ -n "$contents" ]; then
            echo "::error::image contains data under /work/snapshots or /work/output:"
            echo "$contents"
            exit 1
          fi

      - name: Full offline pipeline in the container
        # Proves collect -> assess -> report end to end with no network at all.
        run: |
          mkdir -p out
          docker run --rm --network none \
            -e ICP_TENANT_ID=ci-fixture \
            -e ICP_ENCRYPT_AT_REST=false \
            -e ICP_SNAPSHOT_DIR=/tmp/snapshots \
            -e ICP_OUTPUT_DIR=/tmp/output \
            --tmpfs /tmp:rw,size=128m \
            --entrypoint sh icp:ci -c '
              icp run --fixtures --client-name "CI Tenant" --assessor CI &&
              test -s /tmp/output/*.pdf &&
              echo "PDF generated: $(ls -1 /tmp/output/*.pdf)"
            '

      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, pinned by commit
        with:
          image-ref: icp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
