# The remediation content library.
#
# This file is where the product actually lives. Two competent engineers can
# build identical collectors; this is what the client pays for and forwards to
# their board.
#
# Editorial standard, non-negotiable:
#   * `impact` must be understandable by a non-technical executive director in
#     one sentence, with no unexplained acronyms.
#   * `steps` must let a junior IT person finish the job without further
#     research. Every step names the actual admin console path.
#   * Never write "consider reviewing your posture".

version: "2026.09.1"

remediations:
  mfa.enforce_admins:
    title: Require two-step verification for administrator accounts
    impact: >
      An administrator account without a second factor can be taken over with a
      stolen password alone. Whoever holds it can read every mailbox and file in
      the organization, and can lock out the real staff.
    steps:
      - "Admin console > Security > Authentication > 2-step verification."
      - "Set Enforcement to 'On' and apply it to the organizational unit containing your administrators."
      - "Set 'New user enrollment period' to 1 week so new admins cannot sit unenrolled."
      - "Before enforcing, confirm each administrator has a working second factor and printed backup codes; enforcement locks out anyone unenrolled."
    verification: "Admin console > Directory > Users, add the filter '2-step verification enrollment: Not enrolled'. No administrator should appear."
    owner_hint: IT administrator
    references:
      - https://support.google.com/a/answer/175197

  mfa.enforce_all_users:
    title: Require two-step verification for all staff
    impact: >
      Password-only accounts are the most common way small organizations are
      breached. A second factor stops nearly all of it, including password reuse
      from unrelated breaches.
    steps:
      - "Admin console > Security > Authentication > 2-step verification."
      - "Turn on 'Allow users to turn on 2-step verification' for the whole domain first, and communicate a deadline."
      - "After the deadline, set Enforcement to 'On' for the root organizational unit."
      - "Use the exception group only for shared or service accounts, and document why each one is exempt."
    verification: "Admin console > Directory > Users, add the filter '2-step verification enrollment: Not enrolled'. The list should be empty, apart from documented exceptions."
    owner_hint: IT administrator
    references:
      - https://support.google.com/a/answer/9176657

  mfa.security_keys_for_admins:
    title: Move administrators to phishing-resistant second factors
    impact: >
      Text-message and app codes can be captured by a convincing fake login page
      in real time. Hardware security keys and passkeys cannot, because they
      check the website address before they respond.
    steps:
      - "Buy two hardware security keys per administrator (one primary, one backup)."
      - "Each admin: myaccount.google.com > Security > 2-Step Verification > Add security key."
      - "Admin console > Security > Authentication > 2-step verification > set Methods to 'Only security key' for the admin organizational unit."
      - "Keep printed backup codes in a physical safe, not in Drive."
    verification: "Admin console > Reporting > User reports > Security: every administrator shows at least one security key."
    owner_hint: IT administrator
    references:
      - https://support.google.com/a/answer/2537800

  admin.reduce_super_admins:
    title: Reduce the number of super-administrators
    impact: >
      Every super-administrator is a complete copy of the keys to the
      organization. The more there are, the more chances there are for one to be
      stolen, and the harder it is to work out who changed what.
    steps:
      - "Admin console > Account > Admin roles > Super Admin > Admins."
      - "For each person listed, decide whether they need full control or a narrower role such as User Management Admin or Help Desk Admin."
      - "Assign the narrower role first, confirm the person can still do their job, then remove Super Admin."
      - "Keep two: a named primary and one break-glass account whose credentials are stored offline."
    verification: "Admin console > Account > Admin roles > Super Admin > Admins lists two people: the named primary and the break-glass account."
    owner_hint: IT administrator, with the executive director's sign-off
    references:
      - https://support.google.com/a/answer/9807615

  admin.remove_dormant_admin_rights:
    title: Remove administrator rights from accounts nobody is using
    impact: >
      An administrator account that nobody signs into is one nobody is watching.
      It keeps all its power and none of the attention.
    steps:
      - "Admin console > Account > Admin roles, and cross-reference the accounts named in this finding."
      - "Confirm with the person's manager whether they still need the role."
      - "Remove the role assignment; keep the user account if the person is still employed."
    verification: "Every account listed under Admin roles > Super Admin > Admins has signed in within the last month (Directory > Users, 'Last sign-in' column)."
    owner_hint: IT administrator

  accounts.suspend_dormant:
    title: Suspend accounts that have not been used in months
    impact: >
      Unused accounts keep working and keep costing a licence fee. They are
      attractive to attackers precisely because nobody would notice activity on
      them.
    steps:
      - "Admin console > Directory > Users, and sort by 'Last sign in'."
      - "For each account named in this finding, confirm with the person's manager that it is no longer needed."
      - "Suspend rather than delete first; this preserves data while blocking sign-in."
      - "Important: suspension does NOT revoke applications the account already authorized. Follow the OAuth remediation as well."
    verification: "Directory > Users, sorted by 'Last sign-in': no active account shows a date more than three months ago."
    owner_hint: IT administrator

  accounts.remove_never_used:
    title: Remove accounts that were created but never used
    impact: >
      An account created for someone who never started, or for a project that
      never happened, is a working set of credentials nobody is responsible for.
    steps:
      - "Admin console > Directory > Users; filter on 'Never signed in'."
      - "Confirm each is genuinely unneeded, then delete."
      - "If the account is a placeholder for a future starter, suspend it until their start date instead."
    verification: "Directory > Users: no active account older than a month shows 'Never logged in'."
    owner_hint: IT administrator

  accounts.review_suspended:
    title: Decide what happens to suspended accounts
    impact: >
      Suspended accounts still hold the person's mail and files, and still count
      toward your licence bill. Leaving them indefinitely is a decision by
      default rather than a decision.
    steps:
      - "Admin console > Directory > Users; filter on 'Suspended'."
      - "For each: transfer data to a manager (Admin console > Account > Data migration or Tools > Transfer), then delete."
      - "Where a legal or funder hold applies, record why in writing and set a review date."
    verification: "Directory > Users, filtered on 'Suspended': every account left has a written reason and a review date."
    owner_hint: IT administrator with the executive director

  apps.revoke_admin_equivalent:
    title: Remove administrator-level access from third-party applications
    impact: >
      An application with administrator access can do anything an administrator
      can, without anyone signing in. If that application's own security fails,
      your organization fails with it.
    steps:
      - "Admin console > Security > Access and data control > API controls > Manage Third-Party App Access."
      - "Find the application named in this finding and review the scopes it holds."
      - "If it is not business-critical, set it to 'Blocked'. If it is, contact the vendor about a narrower permission set."
      - "Admin console > Security > API controls > Domain-wide delegation: remove any delegation entry you cannot account for."
    verification: "Security > API controls > Manage Third-Party App Access: the application is listed as Blocked, or no longer listed."
    owner_hint: IT administrator with the executive director

  apps.review_admin_authorized:
    title: Review applications your administrators have connected
    impact: >
      When an administrator connects an application to their own account, that
      application sees everything the administrator sees, which is usually far
      more than any other member of staff.
    steps:
      - "Ask each administrator to open myaccount.google.com > Security > Your connections to third-party apps."
      - "Remove anything they do not actively use."
      - "For tools that are needed, prefer connecting them with a dedicated non-admin account."
    verification: "Security > API controls > Manage Third-Party App Access: each application an administrator connected is marked Trusted on purpose, or Blocked."
    owner_hint: Each administrator, coordinated by IT

  apps.revoke_developer_tool_logins:
    title: Sign administrators out of Google's developer tools
    impact: >
      An administrator who signed in to Google's command-line tools left a
      long-lived login on that computer. Anyone who gets that computer, or a
      copy of its files, inherits the administrator's access without a password
      or a second sign-in step.
    steps:
      - "On the computer where the tools were used, run 'gcloud auth revoke --all' and then 'gcloud auth application-default revoke'."
      - "Then confirm at myaccount.google.com > Security > Your connections to third-party apps & services: 'Google Cloud SDK' and 'Google Auth Library' should no longer be listed. Remove them there if they are."
      - "For future setup work, sign in to these tools with a separate account that is not a super-administrator."
    verification: "At myaccount.google.com > Security > Your connections to third-party apps & services, 'Google Cloud SDK' and 'Google Auth Library' no longer appear for the administrator."
    owner_hint: The administrator named in the finding

  sharing.restrict_public_links:
    title: Close public links on files that should not be public
    impact: >
      A file shared with "anyone with the link" can be opened by anyone who ever
      receives that link, including after the person who shared it has left.
      Search engines sometimes find these links.
    steps:
      - "Open each file listed in the evidence appendix."
      - "Share > General access: change 'Anyone with the link' to 'Restricted', or to your organization if internal sharing is intended."
      - "Admin console > Apps > Google Workspace > Drive and Docs > Sharing settings: set link sharing default to 'Off' for new files."
    verification: "Open each file named in the findings: 'General access' shows 'Restricted' or your organization, not 'Anyone with the link'."
    owner_hint: File owners, coordinated by IT

  sharing.enable_external_warnings:
    title: Warn staff when they share outside the organization
    impact: >
      Most external oversharing is a mistake made in a hurry. A warning at the
      moment of sharing catches it, and costs nothing.
    steps:
      - "Admin console > Apps > Google Workspace > Drive and Docs > Sharing settings."
      - "Enable 'Warn when files owned by users or shared drives are shared outside of your organization'."
      - "Consider setting 'Allow users to receive files from outside' to your risk appetite."
    verification: "Apps > Google Workspace > Drive and Docs > Sharing settings shows 'Warn when files owned by users or shared drives are shared outside' switched on."
    owner_hint: IT administrator

  logging.enable_audit_streams:
    title: Make sure audit logs are being recorded
    impact: >
      If something goes wrong, audit logs are how you find out what happened and
      what was taken. Without them, an incident becomes guesswork, and insurers
      and funders will ask.
    steps:
      - "Admin console > Reporting > Audit and investigation, and confirm the Admin, Login and Token logs return recent events."
      - "If they are empty, check your licence tier: some audit surfaces require Business Plus or Enterprise."
      - "Admin console > Reporting > Manage reporting rules: set an alert for super-admin role changes."
    verification: "Reporting > Audit and investigation: the Admin, Login and OAuth log events pages each show recent entries."
    owner_hint: IT administrator

  logging.verify_audit_coverage:
    title: Confirm quiet audit logs are genuinely quiet
    impact: >
      An empty log is either a very calm month or a broken pipeline. The
      difference matters only when you need the logs, which is the worst possible
      time to find out.
    steps:
      - "Admin console > Reporting > Audit and investigation > Admin log events; widen the date range to 90 days."
      - "If still empty, make a harmless administrative change and confirm it appears within an hour."
      - "If it does not appear, raise a support case with Google referencing the affected log type."
    verification: "Confirm a test event appears in the log."
    owner_hint: IT administrator

  oauth.revoke_suspended_user_grants:
    title: Revoke applications still connected to departed staff
    impact: >
      Suspending someone's account stops them signing in. It does not stop the
      applications they had already connected. Those applications can keep
      reading that person's mail and files after they have left.
    steps:
      - "Admin console > Directory > Users > select the suspended user > Security > Connected applications."
      - "Remove every application listed."
      - "Repeat for each account named in this finding."
      - "Add 'revoke connected applications' to your staff offboarding checklist so this does not recur."
    verification: "Security > API controls > Manage Third-Party App Access: none of the applications named in the findings lists a suspended person under its users."
    owner_hint: IT administrator
    references:
      - https://support.google.com/a/answer/6328701

  oauth.review_broad_scope_apps:
    title: Review applications that can read all mail or files
    impact: >
      These applications can read everything the people who connected them can
      read. That access continues whether or not the application is still being
      used, and it is not affected by password changes.
    steps:
      - "Admin console > Security > Access and data control > API controls > Manage Third-Party App Access."
      - "For each application in this finding, decide: Trusted, Limited, or Blocked."
      - "Block anything nobody can identify as business-critical."
      - "Set 'Unconfigured third-party apps' to 'Blocked' so new applications require approval."
    verification: "Security > API controls > Manage Third-Party App Access: every application that can read mail or files is one you have marked Trusted on purpose."
    owner_hint: IT administrator with the executive director

  oauth.investigate_unverified_apps:
    title: Identify applications not registered with Google
    impact: >
      These applications are not registered with Google, so nothing identifies
      who publishes them. Some will be harmless internal scripts. Some will be
      tools an employee found online and connected without asking.
    steps:
      - "Note the client ID from the evidence appendix."
      - "Ask the affected staff what the application is and why they connected it."
      - "If nobody can account for it: Admin console > Security > API controls > Manage Third-Party App Access > Block."
      - "If it is a legitimate internal script, document its owner and purpose."
    verification: "Every application in this finding has a documented owner, or has been blocked."
    owner_hint: IT administrator

  oauth.review_shadow_it:
    title: Review broad-access tools used by only one or two people
    impact: >
      Tools adopted by one person and never reviewed are the most common source
      of forgotten access. The person may have moved on; the access has not.
    steps:
      - "Ask the named users whether they still use the tool."
      - "If not: myaccount.google.com > Security > Your connections to third-party apps > Remove access."
      - "If it is genuinely useful, put it through whatever approval step you use for software, and add it to your tool inventory."
    verification: "Security > API controls > Manage Third-Party App Access: each single-user application with wide access is marked Trusted on purpose, or Blocked."
    owner_hint: The named users, coordinated by IT

  oauth.revoke_dormant_grants:
    title: Revoke long-lived access nobody is using
    impact: >
      These applications still hold access that lets them reconnect at any
      time without anyone signing in, and Google's audit log shows none of them
      has used it in months. An unused open door is still an open door.
    steps:
      - "Admin console > Security > Access and data control > API controls > Manage Third-Party App Access."
      - "Block each application listed, or ask the affected users to disconnect it from myaccount.google.com."
      - "If a user still needs one, they can reconnect it; revoking costs them a single consent screen."
    verification: "Security > API controls > Manage Third-Party App Access: the applications named in the findings are Blocked, or no longer listed."
    owner_hint: IT administrator

  coverage.restore_access:
    title: Restore access so this area can be assessed
    impact: >
      This part of your environment could not be examined, so this report says
      nothing about it either way. It is a gap in the assessment, not a clean
      result.
    steps:
      - "Review the reason recorded in the finding: usually a missing permission or a licence tier that does not expose the data."
      - "For permission issues, re-run the delegation setup in the client prerequisites checklist."
      - "For licence issues, note the limitation in your own records; it is not a defect in your configuration."
    verification: "At the next assessment, this area appears in the findings or in 'areas checked with no issues found', not in the coverage notes."
    owner_hint: IT administrator with the assessor

  # -- Microsoft 365 (week 5) -------------------------------------------------
  # Paths are the Microsoft Entra admin center (entra.microsoft.com), the
  # Microsoft 365 admin center (admin.microsoft.com) and the SharePoint admin
  # center, as laid out in October 2026.

  m365.mfa.enforce_admins:
    title: Require a second sign-in step for every administrator
    impact: >
      An administrator account that signs in with a password alone can be taken
      over with one stolen or guessed password. Whoever holds it controls every
      mailbox, file and account in the organization.
    steps:
      - "Entra admin center > Entra ID > Conditional Access > Policies > Create new policy from templates."
      - "Choose 'Require multifactor authentication for admins', review the roles it covers, and set the policy to 'On'."
      - "The template covers 14 administrator roles, not all of them. Where the evidence above says the policy 'does not cover this role' (Global Reader is one), open the policy > Users > Include > Directory roles and add that role."
      - "Before switching it on, ask each administrator named in the findings to add the Microsoft Authenticator app at mysignins.microsoft.com > Security info."
      - "Exclude one emergency access account, kept offline with a long password, so a mistake cannot lock everyone out."
    verification: "Entra ID > Users > select each administrator named in the findings > Authentication methods: a method other than Password is listed. Conditional Access > the policy > Users: every role those administrators hold is included."
    owner_hint: IT administrator
    references:
      - https://learn.microsoft.com/entra/identity/conditional-access/policy-old-require-mfa-admin

  m365.mfa.enforce_all_users:
    title: Require a second sign-in step for all staff
    impact: >
      Password-only accounts are the most common way small organizations are
      broken into. A second step at sign-in stops nearly all of it, including
      passwords reused from unrelated breaches.
    steps:
      - "Tell staff the date from which a second step will be required, and point them to mysignins.microsoft.com > Security info to add the Microsoft Authenticator app."
      - "Entra admin center > Entra ID > Conditional Access > Policies > Create new policy from templates > 'Require multifactor authentication for all users'."
      - "Start it in 'Report-only' for a week, check the sign-in logs for who would be affected, then set it to 'On'."
      - "Exclude only the emergency access account, and record why."
    verification: "Entra ID > Authentication methods > User registration details: every enabled staff account shows 'Multifactor authentication capable: Yes'."
    owner_hint: IT administrator
    references:
      - https://learn.microsoft.com/entra/identity/conditional-access/policy-all-users-mfa-strength

  m365.mfa.phishing_resistant_admins:
    title: Move administrators to passkeys or security keys
    impact: >
      Codes and phone approvals can be captured by a convincing fake sign-in
      page and replayed at once. A passkey or security key checks the website
      address itself, so it cannot be tricked that way.
    steps:
      - "Entra admin center > Entra ID > Authentication methods > Policies > Passkey (FIDO2): enable it for all users or for an administrators group."
      - "Each administrator: mysignins.microsoft.com > Security info > Add sign-in method > Passkey, using the Authenticator app or a hardware security key. Register two, one as a spare."
      - "Entra ID > Conditional Access > New policy for the administrator roles > Grant > Require authentication strength > 'Phishing-resistant MFA'."
    verification: "Entra ID > Users > each administrator > Authentication methods: a passkey or FIDO2 security key is listed."
    owner_hint: IT administrator
    references:
      - https://learn.microsoft.com/entra/identity/authentication/how-to-enable-passkey-fido2

  m365.mfa.require_org_wide:
    title: Switch on an organization-wide second-step requirement
    impact: >
      Nothing in the organization's settings requires a second sign-in step,
      so whether each account is protected depends on each person remembering
      to set it up. New staff start unprotected.
    steps:
      - "Simplest: Entra admin center > Entra ID > Overview > Properties > Manage security defaults > 'Enabled'. Microsoft then requires everyone to register a second step within 14 days."
      - "Or, if you use Conditional Access instead: Entra ID > Conditional Access > Policies, and set a policy requiring multifactor authentication for all users to 'On' (not 'Report-only')."
      - "Use one or the other: Microsoft does not allow security defaults and Conditional Access together."
    verification: "Entra ID > Overview > Properties > Manage security defaults shows 'Enabled', or a Conditional Access policy requiring multifactor authentication for all users is 'On'."
    owner_hint: IT administrator
    references:
      - https://learn.microsoft.com/entra/fundamentals/security-defaults

  m365.admins.reduce_global:
    title: Reduce the number of Global Administrators
    impact: >
      Each Global Administrator can change anything in the organization,
      including removing other administrators. Every extra one is another
      account an attacker can aim for.
    steps:
      - "Entra admin center > Entra ID > Roles & admins > Global Administrator > Assignments."
      - "For each person beyond the two you need, give them a narrower role that matches their work (for example User Administrator or Exchange Administrator) and then remove Global Administrator."
      - "Never keep a contractor or a shared account as a Global Administrator."
    verification: "Entra ID > Roles & admins > Global Administrator > Assignments lists no more than two named people, plus any documented emergency access account."
    owner_hint: IT administrator with the executive director
    references:
      - https://learn.microsoft.com/entra/identity/role-based-access-control/best-practices

  m365.admins.remove_dormant:
    title: Remove administrator rights nobody is using
    impact: >
      An administrator account nobody uses is one nobody watches. If its
      password leaks, the takeover can go unnoticed for months.
    steps:
      - "Entra admin center > Entra ID > Roles & admins > select the role > Assignments."
      - "Remove the assignment for each account named in the findings, or delete the account if the person has left."
    verification: "Entra ID > Users > each account named in the findings > Assigned roles shows no administrator role."
    owner_hint: IT administrator

  m365.accounts.remove_unused:
    title: Remove accounts that are not being used
    impact: >
      Unused accounts still have passwords and still count toward your licence
      bill. Nobody notices when one starts being used by someone else.
    steps:
      - "Microsoft 365 admin center > Users > Active users; select each account named in the findings."
      - "If the person has left, choose 'Delete user' and give their mail and files to a manager when asked."
      - "If the account is still needed, ask its owner to sign in, so it no longer looks abandoned."
    verification: "Microsoft 365 admin center > Users > Active users: the accounts named in the findings are gone, or show a recent sign-in in Entra ID > Users."
    owner_hint: IT administrator

  m365.accounts.review_blocked:
    title: Decide what happens to blocked accounts
    impact: >
      A blocked account keeps its mailbox, its files, its sharing links and any
      access it gave to outside applications. Blocking stops the person; it
      does not stop what the account already shared.
    steps:
      - "Microsoft 365 admin center > Users > Active users > filter 'Sign-in blocked'."
      - "For each account, give its mail and OneDrive files to a manager, then choose 'Delete user'."
      - "Where an account must be kept for legal reasons, record why and set a review date."
    verification: "Microsoft 365 admin center > Users > Active users, filtered on 'Sign-in blocked': every account left has a written reason and a review date."
    owner_hint: IT administrator with the executive director

  m365.apps.review_app_only:
    title: Remove organization-wide data access from applications
    impact: >
      This application can read data belonging to every person in the
      organization at any time, without anyone signing in. The evidence below
      names what it can read. Anyone who obtains its password or
      certificate gets the same access.
    steps:
      - "Entra admin center > Entra ID > Enterprise apps > select the application > Permissions."
      - "If nobody can say why it needs this access, choose 'Review permissions' and remove the permission, or delete the application."
      - "If it is genuinely needed, limit it to the mailboxes it uses with an Exchange application access policy, and record the reason."
    verification: "Entra ID > Enterprise apps > the application > Permissions: no permission described as 'all mail' or 'all files' remains under Admin consent, unless recorded as approved."
    owner_hint: IT administrator with the executive director
    references:
      - https://learn.microsoft.com/graph/auth-limit-mailbox-access

  m365.apps.shorten_secrets:
    title: Replace long-lived application secrets
    impact: >
      An application secret is a password for software. One that stays valid
      for years keeps working long after it was copied into a script or an
      email, and nobody remembers where.
    steps:
      - "Entra admin center > Entra ID > App registrations > select the application > Certificates & secrets."
      - "Prefer a certificate. If a secret is unavoidable, create a new one valid for 6 months, update the application to use it, then delete the old secret."
      - "Put the expiry date in a shared calendar so it is renewed before it lapses."
    verification: "Entra ID > App registrations > the application > Certificates & secrets: no client secret expires more than 12 months after it was created."
    owner_hint: IT administrator
    references:
      - https://learn.microsoft.com/entra/identity-platform/how-to-add-credentials

  m365.sharing.close_anyone_links:
    title: Close public links on files that should not be public
    impact: >
      A file shared with 'Anyone with the link' can be opened by whoever has
      the link, with no sign-in, including after the person who shared it has
      left the organization.
    steps:
      - "Ask each owner named in the findings to open the file in OneDrive, choose Share > Manage access, and remove the 'Anyone with the link' link."
      - "For a blocked owner: Microsoft 365 admin center > Users > Active users > select the user > OneDrive > 'Create link to files' to open their OneDrive, then remove the link yourself."
      - "Then restrict the organization setting so new 'Anyone' links cannot be created (see the sharing setting finding)."
    verification: "OneDrive > each file named in the findings > Share > Manage access: no 'Anyone with the link' entry remains."
    owner_hint: File owners, coordinated by IT
    references:
      - https://learn.microsoft.com/sharepoint/turn-external-sharing-on-or-off

  m365.sharing.restrict_org_setting:
    title: Stop staff creating 'Anyone' links
    impact: >
      While the setting allows it, any staff member can make any file open to
      the whole internet with two clicks, and the link keeps working
      indefinitely.
    steps:
      - "SharePoint admin center > Policies > Sharing."
      - "Move the SharePoint and OneDrive sliders from 'Anyone' to 'New and existing guests', or lower if the organization does not share with outsiders."
      - "If 'Anyone' links must stay, set an expiry under 'Choose expiration and permissions options for Anyone links'."
    verification: "SharePoint admin center > Policies > Sharing: neither slider is at 'Anyone'."
    owner_hint: IT administrator
    references:
      - https://learn.microsoft.com/sharepoint/turn-external-sharing-on-or-off

  m365.sharing.restrict_guest_invites:
    title: Limit who can invite outside guests
    impact: >
      When anyone can invite outside people, guests can appear in the
      organization's directory without an administrator knowing, and can be
      given access to files and teams.
    steps:
      - "Entra admin center > Entra ID > External Identities > External collaboration settings."
      - "Under 'Guest invite settings', choose 'Only users assigned to specific admin roles can invite guest users'."
      - "Review the guests named in the findings and remove any nobody can account for: Entra ID > Users, filter User type 'Guest'."
    verification: "Entra ID > External Identities > External collaboration settings: 'Guest invite settings' is not set to anyone in the organization including guests."
    owner_hint: IT administrator

  m365.sharing.limit_outside_trust:
    title: Accept outside sign-in checks only from organizations you choose
    impact: >
      When the checks another organization does at sign-in are accepted from
      every organization, a guest is not asked for a second step here. Your
      protection then depends on how careful each guest's own organization is.
    steps:
      - "Entra admin center > Entra ID > External Identities > Cross-tenant access settings > Default settings > Edit inbound defaults > Trust settings."
      - "Clear every box under 'Trust multifactor authentication from Microsoft Entra tenants' and the two device options, then Save."
      - "For a partner organization you work with closely and trust: Organizational settings > Add organization, then turn the same options on for that organization only."
    verification: "Cross-tenant access settings > Default settings > Inbound access > Trust settings: all three options are off. Any organization with them on is listed by name under Organizational settings."
    owner_hint: IT administrator
    references:
      - https://learn.microsoft.com/entra/external-id/cross-tenant-access-settings-b2b-collaboration

  m365.sharing.limit_shared_channels:
    title: Allow shared Teams channels only with organizations you choose
    impact: >
      People added to a shared channel from another organization are not
      guests, so they never appear in your user list. Open to every
      organization, that is access nobody reviews.
    steps:
      - "Entra admin center > Entra ID > External Identities > Cross-tenant access settings > Default settings > Edit inbound defaults > B2B direct connect."
      - "Under 'External users and groups', choose 'Block access', then Save."
      - "For each organization you share channels with on purpose: Organizational settings > Add organization > Inbound access > B2B direct connect > Allow access."
    verification: "Cross-tenant access settings > Default settings > Inbound access > B2B direct connect: 'Block access'. Each organization allowed is listed by name under Organizational settings."
    owner_hint: IT administrator
    references:
      - https://learn.microsoft.com/entra/external-id/cross-tenant-access-settings-b2b-direct-connect

  m365.logging.enable_logs:
    title: Make sure activity logs are available
    impact: >
      Without these logs, nobody can reconstruct what happened after a
      suspected break-in: which account signed in, from where, and what it
      changed.
    steps:
      - "Sign-in logs need a Microsoft Entra ID P1 licence, included in Microsoft 365 Business Premium. Confirm it under Microsoft 365 admin center > Billing > Your products."
      - "Microsoft Purview portal > Audit: if a banner offers 'Start recording user and admin activity', select it."
    verification: "Entra admin center > Entra ID > Monitoring & health > Sign-in logs shows recent sign-ins, and Audit logs shows recent changes."
    owner_hint: IT administrator

  m365.apps.review_delegated:
    title: Review applications that can read mail or files
    impact: >
      These applications can read everything the people who approved them can
      read. That access continues after password changes and after the person
      stops using the application.
    steps:
      - "Entra admin center > Entra ID > Enterprise apps > select the application > Permissions > User consent tab."
      - "Ask each person listed whether they still use it. If nobody can say what it is for, choose 'Review permissions' and revoke, or delete the application under Properties."
      - "Then tighten who may approve applications (see the consent finding)."
    verification: "Entra ID > Enterprise apps > the application > Permissions: only the people who still need it are listed, or the application is gone."
    owner_hint: IT administrator with the executive director
    references:
      - https://learn.microsoft.com/entra/identity/enterprise-apps/manage-application-permissions

  m365.apps.revoke_departed:
    title: Remove application access left on blocked accounts
    impact: >
      Blocking an account stops the applications it connected from working,
      but their permission stays on record. If the account is ever re-enabled,
      for a returning member of staff or by mistake, every one of those
      applications gets its access to mail and files back, and nobody is asked.
    steps:
      - "If the person has left for good: Microsoft 365 admin center > Users > Active users > select the account > Delete user, giving their mail and files to a manager when asked. A deleted account cannot be used by any application."
      - "If the account must be kept: the Entra admin center shows this access (Entra ID > Enterprise apps > the application > Permissions > User consent) but has no button to remove one person's, and the person cannot remove it for an in-house application either. Remove it with Microsoft Graph PowerShell, signed in as an administrator."
      - "Copy the account's Object ID from Entra ID > Users > the account > Overview. Then run: Connect-MgGraph -Scopes DelegatedPermissionGrant.ReadWrite.All"
      - "Then run, with the Object ID in place of ID: Get-MgOauth2PermissionGrant -Filter \"principalId eq 'ID'\" | ForEach-Object { Remove-MgOauth2PermissionGrant -OAuth2PermissionGrantId $_.Id }. This removes every application's access for that one account, and nobody else's."
    verification: "Entra ID > Enterprise apps > the application > Permissions > User consent: the count of users no longer includes the blocked accounts named in the findings."
    owner_hint: IT administrator
    references:
      - https://learn.microsoft.com/entra/identity/enterprise-apps/manage-application-permissions

  m365.apps.tighten_consent:
    title: Require an administrator to approve access to mail or files
    impact: >
      Today any staff member can let an application read the data named in the
      evidence below, and no administrator sees the request. A convincing fake app is all an
      attacker needs.
    steps:
      - "Entra admin center > Entra ID > Enterprise apps > Consent and permissions > Permission classifications > Low: remove Mail.Read and any other permission that reads mail or files."
      - "User consent settings: choose 'Let Microsoft manage your consent settings' or 'Do not allow user consent'."
      - "Admin consent settings: set 'Users can request admin consent to apps they are unable to consent to' to Yes, and name who reviews the requests."
    verification: "Entra ID > Enterprise apps > Consent and permissions > Permission classifications > Low lists only sign-in permissions (User.Read, openid, profile, email, offline_access)."
    owner_hint: IT administrator
    references:
      - https://learn.microsoft.com/entra/identity/enterprise-apps/configure-user-consent

  m365.apps.restrict_registration:
    title: Stop ordinary users registering applications
    impact: >
      An application registered inside the organization looks trusted to other
      staff when it asks them for access, which makes it a convenient disguise.
    steps:
      - "Entra admin center > Entra ID > Users > User settings."
      - "Set 'Users can register applications' to No. Administrators can still register applications when needed."
    verification: "Entra ID > Users > User settings shows 'Users can register applications: No'."
    owner_hint: IT administrator

  # -- AWS ---------------------------------------------------------------------
  # Findings come from Prowler (config/prowler_check_map.yaml). Console paths
  # are for the AWS Management Console, signed in as an administrator.

  aws.mfa.root:
    title: Add a second sign-in step to the root user
    impact: >
      The root user can do anything in the AWS account, including closing it
      and removing every other administrator. With a password alone, one
      stolen or guessed password hands over the whole account.
    steps:
      - "Sign in to the AWS Management Console as the root user (the email address the account was opened with)."
      - "Click the account name at the top right > Security credentials > Multi-factor authentication (MFA) > Assign MFA device."
      - "Choose 'Passkey or security key' if you have one, otherwise 'Authenticator app', and follow the prompts."
      - "Store the root password and the device somewhere only two named people can reach, and stop using the root user for daily work."
    verification: "IAM > Dashboard > Security recommendations: 'Root user has MFA' shows a green tick."
    owner_hint: Account owner
    references:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/enable-mfa-for-root.html

  aws.mfa.root_hardware:
    title: Protect the root user with a physical security key
    impact: >
      An authenticator app can be tricked by a convincing fake sign-in page,
      and is lost with the phone. A physical security key cannot be copied
      or captured that way.
    steps:
      - "Buy two security keys (one main, one spare)."
      - "Sign in as the root user > account name at the top right > Security credentials > Multi-factor authentication (MFA) > Assign MFA device > 'Passkey or security key'. Register both keys."
      - "Remove the authenticator app from the root user once both keys work."
    verification: "Security credentials > Multi-factor authentication (MFA): the devices listed for the root user are security keys."
    owner_hint: Account owner

  aws.mfa.users:
    title: Require a second sign-in step for every AWS user
    impact: >
      A person who signs in to AWS with a password alone can be impersonated
      with one stolen or reused password, with whatever rights that person
      has in the account.
    steps:
      - "Tell each person named in the findings to sign in, click their name at the top right > Security credentials > Multi-factor authentication (MFA) > Assign MFA device."
      - "For an account nobody uses to sign in to the console, remove its password instead: IAM > Users > the user > Security credentials > Console sign-in > Manage console access > Disable."
      - "Longer term, move people to IAM Identity Center, where a second step can be required for everyone in one place."
    verification: "IAM > Users: the 'MFA' column shows a device for every user that has a console password."
    owner_hint: IT administrator
    references:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa_enable_virtual.html

  aws.admin.remove_root_keys:
    title: Delete the root user's access keys
    impact: >
      A root access key is a password for programs that gives unrestricted
      control of the account and cannot be limited in any way. If it leaks
      from a script or a laptop, the whole account goes with it.
    steps:
      - "Find out what uses the key first: Security credentials > Access keys shows when and where it was last used."
      - "Create a role or user with only the rights that program needs, and move the program to it."
      - "Sign in as the root user > account name at the top right > Security credentials > Access keys > Actions > Deactivate, then Delete after a week with no problems."
    verification: "Signed in as root: Security credentials > Access keys lists no keys."
    owner_hint: Account owner
    references:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user_manage_delete-key.html

  aws.admin.stop_using_root:
    title: Stop using the root user for daily work
    impact: >
      The root user cannot be restricted and its actions are harder to tie
      to a person. Using it every day makes it far more likely that its
      password or session is stolen.
    steps:
      - "Give each administrator a named sign-in of their own: IAM Identity Center > Users, or IAM > Users, with a second sign-in step."
      - "Use the root user only for the few tasks that need it (closing the account, changing the support plan, restoring access)."
      - "Record who may use the root user and where its password and security key are kept."
    verification: "IAM > Credential report (download): the root user's 'password_last_used' date is not recent."
    owner_hint: Account owner

  aws.admin.reduce_admin_users:
    title: Remove full administrative rights attached directly to users
    impact: >
      Each user with full administrative rights is another way into
      everything in the account. Rights attached directly to a person are
      also easy to forget when they change role or leave.
    steps:
      - "IAM > Users > the user named in the findings > Permissions."
      - "If the person does not need to administer the whole account, remove 'AdministratorAccess' and add a policy for the job they do."
      - "If they do, put them in an administrators group instead, so the list of administrators is in one place: IAM > User groups."
    verification: "IAM > Policies > AdministratorAccess > Entities attached: no individual users are listed."
    owner_hint: IT administrator

  aws.admin.fix_wildcard_policies:
    title: Narrow custom policies that allow everything
    impact: >
      A custom policy that allows every action on every resource makes
      whoever holds it an administrator, without the name saying so. It
      is the kind of access that is granted once and never noticed again.
    steps:
      - "IAM > Policies > the policy named in the findings > Entities attached: see who holds it."
      - "Permissions > Edit: replace the statement that allows Action '*' on Resource '*' with the specific actions the holder needs."
      - "If nobody can say what it is for, detach it from everything, wait two weeks, then delete it."
    verification: "IAM > Policies > the policy > Permissions: no statement allows Action '*' on Resource '*'."
    owner_hint: IT administrator

  aws.accounts.remove_unused_logins:
    title: Remove console access nobody is using
    impact: >
      A sign-in that nobody uses still works for anyone who obtains its
      password, and nobody is watching it. These are often accounts of
      people who have left or changed role.
    steps:
      - "For each user named in the findings, ask their manager whether they still need to sign in to AWS."
      - "If not: IAM > Users > the user > Security credentials > Console sign-in > Manage console access > Disable."
      - "If the person has left, delete the user after checking nothing depends on its access keys."
    verification: "IAM > Users: the 'Console last sign-in' column shows a recent date, or 'None' with console access disabled, for every user."
    owner_hint: IT administrator

  aws.accounts.remove_unused_keys:
    title: Delete access keys that are not being used
    impact: >
      An access key is a password for programs. One that nothing uses is
      only useful to someone who finds it in an old script, a laptop or a
      code repository.
    steps:
      - "IAM > Users > the user named in the findings > Security credentials > Access keys: check 'Last used'."
      - "Actions > Deactivate. Wait a week to confirm nothing breaks, then Actions > Delete."
    verification: "IAM > Users > each user > Security credentials > Access keys: every active key shows a recent 'Last used' date."
    owner_hint: IT administrator

  aws.accounts.rotate_keys:
    title: Replace old access keys
    impact: >
      The longer an access key lives, the more scripts, laptops and
      backups hold a copy of it. Replacing it makes every old copy useless.
    steps:
      - "IAM > Users > the user named in the findings > Security credentials > Access keys > Create access key."
      - "Put the new key into the program that uses the old one, and confirm it works."
      - "Deactivate the old key, wait a week, then delete it."
      - "Where the program runs inside AWS, use a role instead of a key, so there is nothing to replace."
    verification: "IAM > Users: the 'Active key age' column shows less than 90 days for every user."
    owner_hint: IT administrator
    references:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id-credentials-access-keys-update.html

  aws.roles.reduce_admin_roles:
    title: Reduce roles that have full administrative rights
    impact: >
      A role is access that a program, a service or another account can
      pick up. One with full administrative rights gives whatever is allowed
      to use it control of the whole account.
    steps:
      - "IAM > Roles > the role named in the findings > Trust relationships: see who or what is allowed to use it."
      - "If it is the role your administrators sign in through, keep it, and record that."
      - "Otherwise: Permissions > remove 'AdministratorAccess' and attach a policy with only the rights that program or account needs."
    verification: "IAM > Policies > AdministratorAccess > Entities attached: every role listed is one you have recorded as an administrator role."
    owner_hint: IT administrator

  aws.storage.close_public_buckets:
    title: Close storage buckets that are open to the public
    impact: >
      Anyone on the internet who finds the address can read what is in a
      public bucket, and tools scan for them constantly. Where the public
      can also write, they can replace or delete your files.
    steps:
      - "S3 > Buckets > the bucket named in the findings > Permissions."
      - "Under 'Block public access (bucket settings)', choose Edit, tick 'Block all public access', and save."
      - "If the bucket is public on purpose (a website's images, for example), record that, and make sure nothing else is stored in it."
    verification: "S3 > Buckets: the 'Access' column shows 'Bucket and objects not public' for every bucket not recorded as public on purpose."
    owner_hint: Whoever owns the data, with IT
    references:
      - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html

  aws.storage.block_public_access:
    title: Switch on the account-wide block on public storage
    impact: >
      With the account-wide block off, any one bucket can be made public by
      a single mistaken setting. Switched on, a mistake like that has no
      effect.
    steps:
      - "First check that no bucket needs to be public: S3 > Buckets, 'Access' column."
      - "S3 > Block Public Access settings for this account > Edit > tick 'Block all public access' > Save."
    verification: "S3 > Block Public Access settings for this account: all four settings show 'On'."
    owner_hint: IT administrator

  aws.logging.enable_trail:
    title: Keep a permanent record of account activity
    impact: >
      AWS keeps 90 days of basic activity history by itself. After that,
      or for anything beyond the basics, there would be nothing to
      reconstruct what happened after a break-in.
    steps:
      - "CloudTrail > Trails > Create trail."
      - "Leave 'Multi-region trail' on, so every region is covered, and create a new storage bucket for the records."
      - "Keep 'Log file validation' enabled, and choose 'Management events', Read and Write."
    verification: "CloudTrail > Trails: one trail shows 'Multi-region trail: Yes' and 'Status: Logging'."
    owner_hint: IT administrator
    references:
      - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-create-a-trail-using-the-console-first-time.html

  aws.logging.enable_validation:
    title: Protect activity records against tampering
    impact: >
      Without log file validation, someone who got into the account could
      edit or delete the records of what they did, and nobody could tell.
    steps:
      - "CloudTrail > Trails > the trail named in the findings > General details > Edit."
      - "Under 'Additional settings', enable 'Log file validation', and save."
    verification: "CloudTrail > Trails > the trail: 'Log file validation' shows 'Enabled'."
    owner_hint: IT administrator

  aws.sharing.review_cross_account:
    title: Review access given to other AWS accounts
    impact: >
      Access given to another AWS account keeps working whoever now
      controls that account: a supplier you stopped using, or a former
      contractor's own account.
    steps:
      - "For a role: IAM > Roles > the role named in the findings > Trust relationships shows the account number allowed to use it."
      - "For a storage bucket: S3 > Buckets > the bucket > Permissions > Bucket policy shows the account number."
      - "Confirm each account number belongs to an organization you still work with. Remove the access if not, or if nobody knows."
      - "For access you keep, record who it is for and require an external ID on roles used by suppliers."
    verification: "IAM > Access analyzer > Findings: every finding for external access is archived with a recorded reason, or resolved."
    owner_hint: IT administrator with the executive director

  aws.sharing.enable_access_analyzer:
    title: Switch on the AWS feature that lists outside access
    impact: >
      IAM Access Analyzer is a free AWS feature that lists every resource
      shared outside the account. With it off, new outside access goes
      unnoticed.
    steps:
      - "IAM > Access analyzer > Create analyzer."
      - "Choose 'External access analysis', leave the zone of trust as 'Current account', and create it."
      - "Repeat in each region you use, then review the findings it lists."
    verification: "IAM > Access analyzer > Analyzer settings: an analyzer with status 'Active' exists in each region you use."
    owner_hint: IT administrator
    references:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-getting-started.html
