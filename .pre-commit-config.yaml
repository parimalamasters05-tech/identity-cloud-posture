# Runs on every commit. The read-only verifier and the secret scanner are the
# two that matter most: one protects the client's tenant, the other protects
# the client's credentials.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: verify-readonly
        name: verify no write-capable API calls
        entry: python tools/verify_readonly.py
        language: system
        pass_filenames: false
        files: ^src/.*\.py$

      - id: no-client-data
        name: block client snapshots and reports
        entry: >-
          bash -c 'echo "Refusing commit: files under snapshots/ or output/ contain
          client identity data and must never be committed." && exit 1'
        language: system
        files: ^(snapshots|output)/(?!\.gitkeep)
